plugins {
    id("com.gradleup.shadow") version "9.6.1"
//    id("io.micronaut.application") version "3.7.3"
    id("io.micronaut.application") version "5.0.2"
    id("io.micronaut.aot") version "5.0.2"
}

version = "0.1"
group = "com.opensourcewithslu.components"

repositories {
    mavenCentral()
}

dependencies {
//    annotationProcessor "io.micronaut:micronaut-inject-java"
//    annotationProcessor "io.micronaut:micronaut-validation"
//    implementation("io.micronaut:micronaut-validation")
    implementation project(":pi4micronaut-utils")
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    compileOnly("io.micronaut:micronaut-http-client")
    testImplementation("io.micronaut:micronaut-http-client")
    implementation("io.micronaut.validation:micronaut-validation")
}


application {
    mainClass.set("com.opensourcewithslu.components.Application")
}
java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}

tasks.named('test') {
    useJUnitPlatform()
    // The only test class (ComponentsTest) has its @Test annotation commented out, so no tests are
    // discovered. Gradle 9 fails a test task that discovers no tests unless this is turned off.
    failOnNoDiscoveredTests = false
}

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.opensourcewithslu.components.*")
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.opensourcewithslu.components.Application'
        )
    }
}

graalvmNative {
    binaries {
        main {
            buildArgs.add("-H:-UseServiceLoaderFeature")
        }
    }
}



